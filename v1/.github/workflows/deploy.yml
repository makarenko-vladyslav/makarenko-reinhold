name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect version directories
        id: version
        run: |
          # List all vN/ directories sorted by version number
          ALL=$(ls -d v[0-9]* 2>/dev/null | sort -V)
          if [ -z "$ALL" ]; then
            echo "No versioned directories found" >&2
            exit 1
          fi
          LATEST=$(echo "$ALL" | tail -1)
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "all=$ALL" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build all versions
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          mkdir -p _site
          for dir in ${{ steps.version.outputs.all }}; do
            echo "::group::Building $dir"
            cd "$dir"
            npm install --no-audit --no-fund
            RAPIER_BUILD_TARGET=static RAPIER_BASE_PATH="/$REPO_NAME/$dir" npm run build
            cd ..
            mkdir -p "_site/$dir"
            cp -r "$dir/out/"* "_site/$dir/"
            echo "::endgroup::"
          done
          # Root redirect (pushed by deployer, copy to artifact)
          if [ -f index.html ]; then
            cp index.html _site/index.html
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
